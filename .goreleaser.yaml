# Release builds: `git tag v0.1.0 && git push --tags` runs this in GitHub Actions.
# Test locally with: goreleaser release --snapshot --clean
version: 2
project_name: deckplane

builds:
  - id: deckplane
    main: .
    binary: deckplane
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/deckplane/cli/internal/buildinfo.Version=v{{ .Version }}
      - -X github.com/deckplane/cli/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/deckplane/cli/internal/buildinfo.Date={{ .Date }}

# install.sh and install.ps1 download these exact names.
archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README-tr.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"

release:
  github:
    owner: deckplane
    name: cli
